version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      react-router:
        patterns:
          - react-router
          - react-router-dom

  - package-ecosystem: npm
    directory: /.consumer-perf
    schedule:
      interval: weekly
    groups:
      react-router:
        patterns:
          - react-router
          - react-router-dom
    ignore:
      # Transitive dep of react-router-dom; update via the group above, not standalone.
      - dependency-name: react-router
        update-types: [version-update:semver-major, version-update:semver-minor, version-update:semver-patch]

  - package-ecosystem: npm
    directory: /examples/consumer-react
    schedule:
      interval: weekly
    groups:
      react-router:
        patterns:
          - react-router
          - react-router-dom
