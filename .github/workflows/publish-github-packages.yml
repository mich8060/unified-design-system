name: Publish GitHub Package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run npm publish --dry-run only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@chghealthcare"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Publish to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "No GitHub Packages token available (GH_PACKAGES_TOKEN / GITHUB_TOKEN)."
            exit 1
          fi
          npm publish
