name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Runs again inside build:lib, but as its own step the red X names the
      # problem ("run npm run generate:subpath-exports") instead of the generic
      # "build failed".
      - name: Component subpath exports in sync
        run: npm run generate:subpath-exports -- --check

      - name: Build library (publish surface)
        run: npm run build:lib

      - name: Recipe layout utilities in styles.css
        run: npm run test:recipe-layout-css

      - name: Script unit tests
        run: npm run test:scripts

      - name: Component unit tests
        run: npm run test:unit

      - name: Validate Figma artifact consistency
        run: npm run validate:figma

      - name: Validate UDS consumer examples
        run: npm run validate:uds

      - name: Per-component bundle gzip budgets
        run: npm run ci:bundle

      - name: Verify npm pack contents
        run: npm run pack:check

  docs-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build docs site
        run: npm run build:docs

      - name: Docs route smoke
        run: npm run test:docs-smoke

      # Baselines are OS-specific (*-linux.png). Generate on Ubuntu:
      #   npm run build:docs && npm run test:visual:update
      # then commit e2e/visual/**/*-linux.png. Until those exist, skip on CI.
      - name: Visual baselines (narrow)
        if: hashFiles('e2e/visual/**/*-linux.png') != ''
        run: npm run test:visual

