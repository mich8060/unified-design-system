name: Publish npm package

# Optional public-npmjs channel. Do not run on GitHub Release — that trigger
# also publishes GitHub Packages, and this package is not on registry.npmjs.org
# (`@chghealthcare/unified-design-system` lives at npm.pkg.github.com).
# Dispatch this workflow only after the npmjs org/scope exists and NPM_TOKEN
# can publish it.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "If true, run npm publish --dry-run only"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            npm publish --dry-run --access public --registry https://registry.npmjs.org
            exit 0
          fi
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "NPM_TOKEN secret is not set."
            exit 1
          fi
          npm publish --access public --registry https://registry.npmjs.org
